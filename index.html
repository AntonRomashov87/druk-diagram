<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Друк діаграм — Smart Chess System®</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{
  --ui-bg:#0C1524;
  --ui-panel:#152036;
  --ui-panel-2:#1C2A45;
  --ui-line:#2A3A5B;
  --ui-text:#E6ECF7;
  --ui-dim:#93A2BE;
  --brass:#B08432;
  --brass-lt:#E4C77A;

  --paper-dark:#C3C9D2;   /* темне поле діаграми */
  --paper-light:#FFFFFF;  /* світле поле діаграми */
  --ink:#10203F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ui-bg);
  color:var(--ui-text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:14px;
}
h1,h2,h3,.ttl{font-family:Oswald,"IBM Plex Sans",sans-serif;font-weight:600;letter-spacing:.02em}

/* ───────── каркас ───────── */
.wrap{display:grid;grid-template-columns:380px 1fr;min-height:100vh}
.side{background:var(--ui-panel);border-right:1px solid var(--ui-line);padding:18px;overflow-y:auto;max-height:100vh}
.main{padding:18px;overflow-x:auto;background:#0A1220}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand .mark{width:40px;height:40px;flex:none;background-size:contain;background-repeat:no-repeat;background-position:center}
.brand h1{font-size:19px;margin:0;line-height:1.1}
.brand small{color:var(--ui-dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}

.block{border:1px solid var(--ui-line);background:var(--ui-panel-2);border-radius:10px;padding:12px;margin-top:14px}
.block > .ttl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--brass-lt);margin:0 0 10px}

label.f{display:block;margin:9px 0 4px;font-size:12px;color:var(--ui-dim)}
textarea,input[type=text],select,input[type=number]{
  width:100%;background:#0E1A2D;border:1px solid var(--ui-line);border-radius:7px;
  color:var(--ui-text);padding:8px 9px;font-family:inherit;font-size:13px
}
textarea{min-height:120px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;resize:vertical}
select{appearance:none;cursor:pointer}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brass);outline-offset:1px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--ui-line);background:#1F2E4B;color:var(--ui-text);
  padding:8px 12px;border-radius:7px;cursor:pointer;font-family:Oswald,sans-serif;
  font-size:13px;letter-spacing:.03em
}
.btn:hover{background:#27395C}
.btn.primary{background:linear-gradient(140deg,var(--brass),#8b6624);border-color:#8b6624;color:#0C1524;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 9px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row.tight{margin-top:6px}

.chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--brass)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.stat{font-size:12px;color:var(--ui-dim);margin-top:8px}
.stat b{color:var(--brass-lt)}

/* ───────── список задач ───────── */
.tasks{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;padding-right:4px}
.task{
  display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;
  background:#12203A;border:1px solid var(--ui-line);border-radius:7px;padding:6px 8px;font-size:12px
}
.task.off{opacity:.4}
.task .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .nm i{display:block;color:var(--ui-dim);font-style:normal;font-size:11px}
.task select{padding:3px 5px;font-size:11px;width:auto}
.task .plies{display:flex;align-items:center;gap:3px;color:var(--ui-dim);font-size:11px}
.task .plies button{background:#22314F;border:1px solid var(--ui-line);color:var(--ui-text);border-radius:4px;cursor:pointer;padding:1px 5px}

/* ───────── аркуші ───────── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.sheets{transform-origin:top left}
.sheet{
  width:210mm;min-height:297mm;background:#fff;color:var(--ink);
  padding:12mm 10mm;margin:0 auto 18px;box-shadow:0 8px 40px rgba(0,0,0,.5);
  display:flex;flex-direction:column
}
.sheet-head{border-bottom:1.2pt solid var(--ink);padding-bottom:2mm;margin-bottom:3mm;display:flex;align-items:flex-end;gap:6mm}
.sheet-head h2{font-size:15pt;margin:0;line-height:1.05}
.sheet-head .sub{font-size:9pt;color:#41506B;margin-top:.8mm}
.sheet-head .pg{margin-left:auto;font-family:Oswald,sans-serif;font-size:9pt;color:#41506B;white-space:nowrap}
.sheet-head .logo{width:11mm;height:11mm;flex:none;background-size:contain;background-repeat:no-repeat;background-position:center}
.sheet-foot .logo{width:6mm;height:6mm;flex:none;background-size:contain;background-repeat:no-repeat;background-position:center}

.board-grid{display:grid;gap:2.5mm 5mm;justify-content:space-between;align-content:start}

.diag{display:flex;flex-direction:column;align-items:center;break-inside:avoid}
.diag-ttl{
  font-family:"IBM Plex Sans",sans-serif;font-size:7.5pt;line-height:1.2;color:#41506B;
  align-self:stretch;margin-bottom:.5mm;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow-wrap:break-word
}
.diag-cap{
  align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:2mm;
  font-family:Oswald,sans-serif;font-size:8.5pt;line-height:1.15;margin-top:.9mm;color:var(--ink)
}
.diag-cap .s{white-space:nowrap}
.diag-cap.empty{display:none}

/* режим початківця — лінійки для запису ходів */
.lines{align-self:stretch;margin-top:1.4mm;display:flex;flex-direction:column;gap:2.2mm}
.ln{display:flex;align-items:flex-end;gap:1.5mm}
.ln .no{font-family:Oswald,sans-serif;font-size:8pt;line-height:1;color:#41506B;min-width:3.6mm}
.ln .sl{flex:1;border-bottom:.5pt solid #41506B;height:4mm}

.bwrap{position:relative;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:0}
.board{
  display:grid;grid-template-columns:repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq));
  border:0.8pt solid var(--ink)
}
.sq{display:grid;place-items:center;overflow:hidden}
.sq.l{background:var(--paper-light)}
.sq.d{background:var(--paper-dark)}
/* ── накреслення фігур ── */
.pc{
  font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans","Apple Symbols",serif;
  font-size:calc(var(--sq)*.84);line-height:1;
}
/* 1. суцільні: біла заливка + обведення */
[data-pc="solid"] .pc.w{color:#fff;-webkit-text-stroke:.28mm var(--ink);
  text-shadow:.13mm 0 0 var(--ink),-.13mm 0 0 var(--ink),0 .13mm 0 var(--ink),0 -.13mm 0 var(--ink)}
[data-pc="solid"] .pc.b{color:#0B0F17;-webkit-text-stroke:.1mm #0B0F17}

/* 2. класичні: два шари — біла заливка під чорним контурним гліфом */
.pc.two{display:grid;place-items:center}
.pc.two i{grid-area:1/1;font-style:normal;line-height:1}
[data-pc="classic"] .pc.two i.fill{color:#fff}
[data-pc="classic"] .pc.two i.line{color:#0B0F17}
[data-pc="classic"] .pc.b{color:#0B0F17}

/* 3. набори lichess — SVG у фоні клітинки */
.pc.img{
  width:100%;height:100%;
  background-size:contain;background-repeat:no-repeat;background-position:center
}

/* координати навколо дошки */
.board{grid-column:2;grid-row:1}
.coords-f{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(8,var(--sq));
  font-family:Oswald,sans-serif;font-size:calc(var(--sq)*.3);line-height:1.2;color:#41506B;
  text-align:center;padding-top:.4mm}
.coords-r{grid-column:1;grid-row:1;display:grid;grid-template-rows:repeat(8,var(--sq));
  font-family:Oswald,sans-serif;font-size:calc(var(--sq)*.3);line-height:1;color:#41506B;
  align-items:center;padding-right:.9mm;text-align:right}

.mover{width:calc(var(--sq)*.44);height:calc(var(--sq)*.44);border:0.8pt solid var(--ink);display:inline-block;vertical-align:middle}
.mover.w{background:#fff}
.mover.b{background:#0B0F17}

.sheet-foot{margin-top:auto;padding-top:2mm;border-top:.6pt solid #9AA6BC;display:flex;font-size:7.5pt;line-height:1.2;color:#41506B;gap:5mm}
.sheet-foot .r{margin-left:auto}

.answers{font-size:9pt;column-count:2;column-gap:8mm}
.answers div{break-inside:avoid;margin-bottom:1.6mm}
.answers b{font-family:Oswald,sans-serif}

.empty{padding:60px 20px;text-align:center;color:var(--ui-dim)}
.empty .big{font-size:52px;opacity:.35}

/* ───────── вибір позиції ───────── */
.modal{position:fixed;inset:0;background:rgba(6,11,20,.82);display:none;place-items:center;z-index:50;padding:16px}
.modal.on{display:grid}
.modal-box{background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:12px;
  padding:16px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.pick-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pick-head b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-board{display:flex;justify-content:center}
.pick-nav{display:flex;align-items:center;gap:8px;margin-top:12px}
.pick-nav input[type=range]{flex:1;accent-color:var(--brass)}
.mv-list{margin-top:10px;max-height:110px;overflow-y:auto;font-size:12.5px;line-height:1.9;
  background:#0E1A2D;border:1px solid var(--ui-line);border-radius:7px;padding:7px 9px}
.mv-list span{cursor:pointer;padding:1px 4px;border-radius:4px}
.mv-list span:hover{background:#22314F}
.mv-list span.cur{background:var(--brass);color:#0C1524;font-weight:600}
.mv-list i{color:var(--ui-dim);font-style:normal;padding-right:2px}
.task .nm{cursor:pointer}
.task .nm:hover{color:var(--brass-lt)}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .side{max-height:none;border-right:0;border-bottom:1px solid var(--ui-line)}
  .main{padding:12px}
}

@media print{
  html,body{background:#fff!important}
  .side,.toolbar{display:none!important}
  .main{padding:0;overflow:visible;background:#fff}
  .wrap{display:block}
  .sheets{transform:none!important;width:auto!important}
  .sheet{
    width:auto;min-height:270mm;margin:0;padding:0;box-shadow:none;
    break-after:page;page-break-after:always
  }
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .sq,.mover,.logo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pc.img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sq.d{background:var(--paper-dark)!important}
  .mover.b{background:#0B0F17!important}
}
@page{size:A4 portrait;margin:12mm 10mm}
</style>
</head>
<body>
<div class="wrap">

<!-- ═══════════ ПАНЕЛЬ ═══════════ -->
<aside class="side">
  <div class="brand">
    <div class="mark" id="brandMark"></div>
    <div>
      <h1>Друк діаграм</h1>
      <small>Smart Chess System®</small>
    </div>
  </div>

  <div class="block">
    <p class="ttl">1. Позиції</p>
    <label class="f">Встав PGN або список FEN (по одному в рядку)</label>
    <textarea id="src" placeholder='[Event "Мат у 2 ходи"]
[FEN "r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 0 1"]
1. Qxf7# 1-0

…або просто:
8/8/8/8/8/5k2/6q1/6K1 b - - 0 1'></textarea>
    <label class="f">Яку позицію брати з партії</label>
    <div style="display:flex;gap:6px">
      <select id="posMode">
        <option value="auto">Автоматично</option>
        <option value="last">Кінцева позиція</option>
        <option value="prelast">Перед останнім ходом</option>
        <option value="atmove">З ходу №</option>
      </select>
      <input type="number" id="posMove" value="12" min="1" style="width:74px;display:none">
    </div>
    <div class="row tight">
      <button class="btn" id="btnFile">Відкрити .pgn</button>
      <button class="btn primary" id="btnParse">Розібрати</button>
      <button class="btn sm" id="btnClear">Очистити</button>
    </div>
    <input type="file" id="file" accept=".pgn,.txt,.fen" hidden multiple>
    <p class="stat" id="stat">Позицій: <b>0</b></p>
  </div>

  <div class="block">
    <p class="ttl">2. Аркуш</p>
    <div class="grid2">
      <div>
        <label class="f">Діаграм на аркуші</label>
        <select id="perPage">
          <option value="6">6 — 2×3 (велика)</option>
          <option value="8">8 — 2×4</option>
          <option value="9">9 — 3×3</option>
          <option value="12" selected>12 — 3×4</option>
          <option value="16">16 — 4×4</option>
          <option value="20">20 — 4×5 (дрібна)</option>
        </select>
      </div>
      <div>
        <label class="f">Хто на ході</label>
        <select id="moverMode">
          <option value="text">Підпис текстом</option>
          <option value="mark">Позначка ▢ / ▮</option>
          <option value="hide">Приховати</option>
        </select>
      </div>
    </div>
    <label class="f">Фігури</label>
    <select id="pieceSet">
      <option value="cburnett" selected>Lichess — cburnett (класика)</option>
      <option value="chessnut">Lichess — chessnut</option>
      <option value="classic">Системні — контурні білі</option>
      <option value="solid">Системні — суцільні з обведенням</option>
    </select>
    <label class="f">Заголовок</label>
    <input type="text" id="title" value="Мат у 2 ходи">
    <label class="f">Підзаголовок</label>
    <input type="text" id="subtitle" placeholder="Група, дата, тренер">
    <label class="f">Підпис під кожною діаграмою (спільний)</label>
    <input type="text" id="taskLabel" placeholder="напр. Мат у 2 ходи — залиш порожнім, якщо не треба">

    <label class="chk"><input type="checkbox" id="optCoords"> Координати a–h / 1–8</label>
    <label class="chk"><input type="checkbox" id="optNum" checked> Нумерація задач</label>
    <label class="chk"><input type="checkbox" id="optTitles"> Назва задачі з PGN</label>
    <label class="chk"><input type="checkbox" id="optFlip"> Розвернути дошку, коли на ході чорні</label>
    <label class="chk"><input type="checkbox" id="optAnswers"> Аркуш відповідей у кінці</label>
    <label class="chk"><input type="checkbox" id="optFooter" checked> Підвал з підписом автора</label>
    <label class="chk"><input type="checkbox" id="optLogo" checked> Логотип Smart Chess System на аркуші</label>
    <label class="chk"><input type="checkbox" id="optKids"> Режим початківця — лінійки для запису ходів</label>
    <div id="kidsBox" style="display:none">
      <div class="grid2">
        <div>
          <label class="f">Рядків під діаграмою</label>
          <select id="kidsLines">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
        <div>
          <label class="f">Запис у рядку</label>
          <select id="kidsCols">
            <option value="2">Білі й чорні</option>
            <option value="1">Один хід</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="block">
    <p class="ttl">3. Вибір задач</p>
    <div class="row tight">
      <button class="btn sm" id="selAll">Усі</button>
      <button class="btn sm" id="selNone">Жодної</button>
      <button class="btn sm" id="selFirst">Перші 12</button>
      <button class="btn sm" id="selRand">12 випадкових</button>
      <button class="btn sm" id="shuffle">Перемішати</button>
    </div>
    <div class="tasks" id="tasks"></div>
  </div>
</aside>

<!-- ═══════════ ПЕРЕГЛЯД ═══════════ -->
<main class="main">
  <div class="toolbar">
    <button class="btn primary" id="btnPrint">Друкувати</button>
    <span class="stat" id="pgstat"></span>
    <span class="stat" id="fit"></span>
    <span class="sp"></span>
    <span class="stat">У вікні друку: поля «Стандартні», масштаб 100%, колонтитули вимкнені</span>
    <button class="btn sm" id="zoomOut">−</button>
    <span class="stat" id="zoomVal">100%</span>
    <button class="btn sm" id="zoomIn">+</button>
  </div>
  <div id="sheets" class="sheets"></div>
</main>
</div>

<!-- ═══════════ ВИБІР ПОЗИЦІЇ ═══════════ -->
<div class="modal" id="pick">
  <div class="modal-box">
    <div class="pick-head">
      <b class="ttl" id="pickTitle">Позиція</b>
      <button class="btn sm" id="pickClose">Закрити</button>
    </div>
    <div class="pick-board" id="pickBoard" style="--sq:9mm"></div>
    <div class="pick-nav">
      <button class="btn sm" id="pickPrev">◂</button>
      <input type="range" id="pickRange" min="0" max="0" value="0">
      <button class="btn sm" id="pickNext">▸</button>
      <span class="stat" id="pickPly"></span>
    </div>
    <div class="mv-list" id="pickMoves"></div>
    <div class="row">
      <button class="btn primary" id="pickTake">Взяти цю позицію</button>
      <button class="btn sm" id="pickStart">На початок</button>
      <button class="btn sm" id="pickEnd">У кінець</button>
    </div>
  </div>
</div>

/* ═══════════════════════════════════════════
   Модель
   ═══════════════════════════════════════════ */
let TASKS = [];   // {fen, fens[], ply, title, solution, mover:'auto|w|b|hide', on:true}
let zoom = 1;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const GLYPH = {k:'\u265A',q:'\u265B',r:'\u265C',b:'\u265D',n:'\u265E',p:'\u265F'};
const GLYPH_W = {k:'\u2654',q:'\u2655',r:'\u2656',b:'\u2657',n:'\u2658',p:'\u2659'};
const FEN_RE = /^\s*((?:[rnbqkpRNBQKP1-8]+\/){7}[rnbqkpRNBQKP1-8]+)\s+([wb])(?:\s+(\S+)\s+(\S+))?/;

/* ─── розбір ─── */
function parseInput(text){
  text = text.replace(/\r/g,'');
  const out = [];

  // 1. голі FEN-рядки
  const lines = text.split('\n');
  const looksLikePgn = /\[\s*\w+\s+"/.test(text);

  if(!looksLikePgn){
    const LOOSE = /((?:[rnbqkpRNBQKP1-8]+\/){7}[rnbqkpRNBQKP1-8]+)\s+([wb])(?:\s+\S+\s+\S+)?/;
    for(const ln of lines){
      const m = ln.match(LOOSE);
      if(m) out.push(makeTask(m[0].trim(), '', ''));
    }
    return out;
  }

  // 2. PGN: ріжемо на партії
  const games = [];
  let cur = null, inMoves = false;
  for(const ln of lines){
    const m = ln.match(/^\s*\[\s*(\w+)\s+"([^"]*)"/);
    // нова партія: після ходів, або коли тег повторюється (задачі без ходів ідуть підряд)
    const restart = m && (cur === null || inMoves || cur.tags[m[1]] !== undefined);
    if(restart){ cur = {tags:{}, moves:''}; games.push(cur); inMoves = false; }
    if(cur === null) continue;
    if(m){
      cur.tags[m[1]] = m[2];
    } else {
      if(ln.trim()) inMoves = true;
      cur.moves += ln + ' ';
    }
  }

  for(const g of games){
    const fen = g.tags.FEN && FEN_RE.test(g.tags.FEN) ? g.tags.FEN.trim() : 'start';
    const title = buildTitle(g.tags, g.moves);
    const sol = cleanMoves(g.moves);
    out.push(makeTask(fen, title, sol, tquPly(g.moves)));
  }
  return out;
}

/* Назва задачі. ChessBase кладе її в різні місця залежно від того,
   як зібрана база, тож перебираємо джерела за пріоритетом. */
function buildTitle(t, raw){
  const ok = v => v && !/^[\s?.\-–—]*$/.test(v) && !/^(chessbase|new game|unknown|\*)$/i.test(v.trim());
  const cut = v => { v = v.trim().replace(/\s+/g,' '); return v.length > 70 ? v.slice(0,69) + '…' : v; };

  if(ok(t.Event) && !/chessbase/i.test(t.Event)) return cut(t.Event);

  // тренувальне питання ChessBase: {[%tqu "Знайди мат…", …]}
  const q = raw && raw.match(/\[%tqu\s+"([^"]+)"/);
  if(q && ok(q[1])) return cut(q[1]);

  const w = ok(t.White) ? t.White.trim() : '';
  const b = ok(t.Black) ? t.Black.trim() : '';
  if(w && b) return cut(w + ' — ' + b);
  if(w) return cut(w);
  if(b) return cut(b);

  // звичайний текстовий коментар (не службова команда %…)
  if(raw){
    const m = raw.match(/\{\s*([^%}][^}]*)\}/);
    if(m && ok(m[1])) return cut(m[1]);
  }

  for(const k of ['Annotator','Source','Opening','ECO','Site']){
    if(ok(t[k])) return cut(t[k]);
  }
  return '';
}

/* ChessBase позначає тренувальну позицію коментарем {[%tqu "…"]} — беремо саме її */
function tquPly(raw){
  const i = raw.indexOf('%tqu');
  if(i < 0) return null;
  const open = raw.lastIndexOf('{', i);
  return sanTokens(cleanMoves(raw.slice(0, open < 0 ? i : open))).length;
}

function cleanMoves(txt){
  return txt
    .replace(/\{[^}]*\}/g,' ')      // коментарі
    .replace(/\$\d+/g,' ')          // NAG
    .replace(/\([^()]*\)/g,' ')     // варіанти будь-якої вкладеності
    .replace(/\([^()]*\)/g,' ')
    .replace(/\([^()]*\)/g,' ')
    .replace(/\([^()]*\)/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function makeTask(fen, title, solution, hint){
  const start = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const hadFen = fen !== 'start';
  const base = hadFen ? fen : start;
  const t = {fen:base, base, fens:[base], sans:[], ply:0, title, solution, mover:'auto', on:true, hadFen};

  // розкручуємо ходи в позиції — щоб діаграму можна було взяти з будь-якого півходу
  if(solution && window.Chess){
    try{
      const ch = new Chess(base);
      for(const tk of sanTokens(solution)){
        const mv = ch.move(tk, {sloppy:true});
        if(!mv) break;
        t.sans.push(mv.san);
        t.fens.push(ch.fen());
      }
    }catch(e){}
  }

  const last = t.fens.length - 1;
  const mode = (typeof $ === 'function' && $('#posMode')) ? $('#posMode').value : 'auto';
  let ply = 0;
  if(hint != null && hint <= last) ply = hint;                 // тренувальна позиція ChessBase
  else if(mode === 'last') ply = last;
  else if(mode === 'prelast') ply = Math.max(0, last - 1);
  else if(mode === 'atmove'){
    const n = Math.max(1, +($('#posMove') ? $('#posMove').value : 1) || 1);
    ply = Math.min(last, (n - 1) * 2);
  }
  else if(!hadFen) ply = last;                                  // 'auto': без тега FEN — кінцева позиція
  t.ply = ply;
  t.fen = t.fens[t.ply];
  return t;
}

function sanTokens(txt){
  return txt.split(/\s+/)
    .map(x => x.replace(/^\d+\.+/, ''))
    .filter(x => x && !/^\d+\.+$/.test(x) && !/^(1-0|0-1|1\/2-1\/2|\*)$/.test(x));
}

/* ─── дошка ─── */
function boardHTML(fen, flip, coords){
  const style = ($('#pieceSet') && $('#pieceSet').value) || 'solid';
  const [pos] = fen.split(' ');
  let rows = pos.split('/');
  let files = ['a','b','c','d','e','f','g','h'];
  let ranks = [8,7,6,5,4,3,2,1];
  if(flip){ rows = rows.slice().reverse().map(r => [...r].reverse().join('')); files = files.slice().reverse(); ranks = ranks.slice().reverse(); }

  let cells = '';
  rows.forEach((row, r) => {
    let f = 0;
    for(const ch of row){
      if(/\d/.test(ch)){
        for(let i=0;i<+ch;i++){ cells += sq(r, f, '', style); f++; }
      } else {
        cells += sq(r, f, ch, style); f++;
      }
    }
  });

  let html = '<div class="bwrap" data-pc="' + style + '">';
  if(coords) html += '<div class="coords-r">' + ranks.map(x=>'<div>'+x+'</div>').join('') + '</div>';
  html += '<div class="board">' + cells + '</div>';
  if(coords) html += '<div class="coords-f">' + files.map(x=>'<div>'+x+'</div>').join('') + '</div>';
  html += '</div>';
  return html;
}
function sq(r, f, ch, style){
  const dark = (r + f) % 2 === 1;
  return '<div class="sq ' + (dark?'d':'l') + '">' + (ch ? pieceHTML(ch, style) : '') + '</div>';
}

function pieceHTML(ch, style){
  const isW = ch === ch.toUpperCase();
  const k = ch.toLowerCase();
  const col = isW ? 'w' : 'b';

  if(PIECE_SETS[style]){
    return '<span class="pc img p-' + style + '-' + col + k.toUpperCase() + '"></span>';
  }
  // класичні: білу фігуру складаємо з двох гліфів — заливка + контур
  if(style === 'classic' && isW){
    return '<span class="pc two w"><i class="fill">' + GLYPH[k] + '</i>' +
           '<i class="line">' + GLYPH_W[k] + '</i></span>';
  }
  return '<span class="pc ' + col + '">' + GLYPH[k] + '</span>';
}

/* Малюнки фігур підключаємо класами: один data-URI на фігуру,
   а не по копії в кожній клітинці (інакше розмітка аркуша роздувається). */
function injectPieceCSS(){
  if(typeof document.createElement !== 'function') return;
  let css = '';
  for(const set in PIECE_SETS){
    for(const n in PIECE_SETS[set]){
      css += '.p-' + set + '-' + n + '{background-image:url(' + PIECE_SETS[set][n] + ')}\n';
    }
  }
  const el = document.createElement('style');
  el.textContent = css;
  document.head.appendChild(el);
}

/* ─── розкладка ─── */
const LAYOUT = {
  6:  {cols:2, sq:'9.5mm'},   // дошка 76 мм
  8:  {cols:2, sq:'8mm'},     // 2×4 — для режиму початківця
  9:  {cols:3, sq:'7.6mm'},   // дошка 61 мм
  12: {cols:3, sq:'6.5mm'},   // дошка 52 мм
  16: {cols:4, sq:'5.5mm'},   // дошка 44 мм
  20: {cols:4, sq:'5.2mm'}    // дошка 42 мм
};

function render(){
  const per = +$('#perPage').value;
  const lay = LAYOUT[per];
  const moverMode = $('#moverMode').value;
  const coords = $('#optCoords').checked;
  const showNum = $('#optNum').checked;
  const showTitles = $('#optTitles').checked;
  const autoFlip = $('#optFlip').checked;
  const withAnswers = $('#optAnswers').checked;
  const withFooter = $('#optFooter').checked;
  const withLogo = $('#optLogo').checked;
  const kids = $('#optKids').checked;
  const kidsLines = +$('#kidsLines').value;
  const kidsCols = +$('#kidsCols').value;
  const title = $('#title').value.trim();
  const sub = $('#subtitle').value.trim();
  const label = $('#taskLabel').value.trim();

  const list = TASKS.filter(t => t.on);
  const box = $('#sheets');

  if(!list.length){
    box.innerHTML = '<div class="empty"><div class="big">♞</div><p>Встав PGN або FEN зліва і натисни «Розібрати».</p></div>';
    $('#pgstat').textContent = '';
    $('#fit').textContent = '';
    return;
  }

  const pages = Math.ceil(list.length / per);
  let html = '';
  for(let p = 0; p < pages; p++){
    const chunk = list.slice(p*per, (p+1)*per);
    html += '<section class="sheet">';
    html += '<div class="sheet-head">' + (withLogo ? logoTag('logo') : '') +
            '<div><h2>' + esc(title || 'Діаграми') + '</h2>' +
            (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>' +
            '<div class="pg">аркуш ' + (p+1) + ' / ' + (pages + (withAnswers?1:0)) + '</div></div>';
    html += '<div class="board-grid" style="grid-template-columns:repeat(' + lay.cols + ',max-content);--sq:' + lay.sq + '">';

    chunk.forEach((t, i) => {
      const n = p*per + i + 1;
      const side = (t.fen.split(' ')[1] === 'b') ? 'b' : 'w';
      const flip = autoFlip && side === 'b';
      const show = t.mover === 'hide' ? null : (t.mover === 'auto' ? side : t.mover);

      html += '<div class="diag">';
      if(showTitles && t.title) html += '<div class="diag-ttl">' + esc(t.title) + '</div>';
      html += boardHTML(t.fen, flip, coords);

      // номер і «хто на ході» — в один рядок під дошкою, щоб не з'їдати висоту
      let right = '';
      if(show && moverMode === 'text') right = show === 'w' ? 'Хід білих' : 'Хід чорних';
      else if(show && moverMode === 'mark') right = '<span class="mover ' + show + '"></span>';
      if(label) right = (right ? right + ' · ' : '') + esc(label);
      const left = showNum ? '№ ' + n : '';
      html += '<div class="diag-cap' + (left || right ? '' : ' empty') + '">' +
              '<span class="n">' + left + '</span><span class="s">' + right + '</span></div>';
      if(kids) html += linesHTML(kidsLines, kidsCols, side);
      html += '</div>';
    });

    html += '</div>';
    if(withFooter) html += footHTML();
    html += '</section>';
  }

  if(withAnswers){
    html += '<section class="sheet"><div class="sheet-head">' + (withLogo ? logoTag('logo') : '') + '<div><h2>Відповіді</h2>' +
            (title ? '<div class="sub">' + esc(title) + '</div>' : '') + '</div>' +
            '<div class="pg">аркуш ' + (pages+1) + ' / ' + (pages+1) + '</div></div>';
    html += '<div class="answers">';
    list.forEach((t, i) => {
      const s = t.sans.length ? solutionFromPly(t) : (t.solution || '—');
      html += '<div><b>' + (i+1) + '.</b> ' + esc(s) + '</div>';
    });
    html += '</div>';
    if(withFooter) html += footHTML();
    html += '</section>';
  }

  box.innerHTML = html;
  $('#pgstat').textContent = list.length + ' діаграм · ' + (pages + (withAnswers?1:0)) + ' аркуш(і)';
  requestAnimationFrame(fitBoards);
}

/* Підганяє дошку так, щоб усі ряди гарантовано вмістились у 297 мм.
   Міряємо реальні висоти підписів і координат — вони залежать від шрифту,
   тому рахувати «на папері» не можна. */
function fitBoards(){
  const sheet = document.querySelector('.sheet');
  const grid = sheet && sheet.querySelector('.board-grid');
  const diag = grid && grid.querySelector('.diag');
  const board = diag && diag.querySelector('.board');
  if(!board){ $('#fit').textContent = ''; return; }

  const MM = 96/25.4;
  const per = +$('#perPage').value;
  const cols = LAYOUT[per].cols;
  const rows = Math.ceil(per / cols);
  const head = sheet.querySelector('.sheet-head');
  const foot = sheet.querySelector('.sheet-foot');
  const cs = getComputedStyle(grid);
  const gapY = parseFloat(cs.rowGap) || 0;
  const gapX = parseFloat(cs.columnGap) || 0;

  const availH = 297*MM - 24*MM - (head ? head.offsetHeight : 0) - (foot ? foot.offsetHeight : 0) - 2*MM;
  const availW = 210*MM - 20*MM;

  let sq = 0;
  for(let pass = 0; pass < 3; pass++){
    const over = diag.offsetHeight - board.offsetHeight;      // номер + підпис + координати
    const byH = ((availH - gapY*(rows-1)) / rows - over - 3) / 8;
    const byW = ((availW - gapX*(cols-1)) / cols - 3) / 8;
    sq = Math.max(3*MM, Math.min(byH, byW));
    document.querySelectorAll('.board-grid').forEach(g => g.style.setProperty('--sq', sq.toFixed(2) + 'px'));
  }
  $('#fit').textContent = 'дошка ' + (sq*8/MM).toFixed(0) + ' мм';
}

function solutionFromPly(t){
  const toks = t.sans.length ? t.sans : sanTokens(t.solution || '');
  const rest = toks.slice(t.ply);
  if(!rest.length) return '—';
  // нумеруємо від того півходу, з якого стоїть діаграма
  const white = (t.fen.split(' ')[1] || 'w') === 'w';
  let out = '', num = 1;
  rest.forEach((san, i) => {
    const isWhite = white ? i % 2 === 0 : i % 2 === 1;
    if(i === 0 && !isWhite) out += num + '... ';
    else if(isWhite) out += num + '. ';
    out += san + ' ';
    if(!isWhite) num++;
  });
  return out.trim();
}

/* Лінійки для запису: зліва номер ходу, далі порожні місця.
   Коли на ході чорні, перший рядок починається з «1…» — як у нотації. */
function linesHTML(n, cols, side){
  let html = '<div class="lines">';
  for(let i = 0; i < n; i++){
    const no = (i + 1) + (i === 0 && side === 'b' ? '…' : '.');
    html += '<div class="ln"><span class="no">' + no + '</span>';
    for(let c = 0; c < cols; c++) html += '<span class="sl"></span>';
    html += '</div>';
  }
  return html + '</div>';
}

function footHTML(){
  return '<div class="sheet-foot"><div>Антон Ромашов — FIDE Trainer, національний арбітр</div>' +
         '<div class="r">Smart Chess System®</div></div>';
}
function logoTag(cls){ return '<div class="' + cls + '" style="background-image:url(' + LOGO + ')"></div>'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ─── список задач у панелі ─── */
function renderTasks(){
  const box = $('#tasks');
  if(!TASKS.length){ box.innerHTML = '<p class="stat">Порожньо.</p>'; }
  else{
    box.innerHTML = TASKS.map((t, i) => {
      const side = t.fen.split(' ')[1] === 'b' ? 'чорні' : 'білі';
      const plyCtl = t.fens.length > 1
        ? '<span class="plies"><button data-ply="-1" data-i="' + i + '">◂</button>' + t.ply + '/' + (t.fens.length-1) +
          '<button data-ply="1" data-i="' + i + '">▸</button></span>' : '';
      return '<div class="task' + (t.on?'':' off') + '">' +
        '<input type="checkbox" data-on="' + i + '"' + (t.on?' checked':'') + '>' +
        '<div class="nm" data-i="' + i + '" title="Вибрати позицію з партії">' + (i+1) + '. ' +
          esc(t.title || 'позиція') + '<i>на ході ' + side +
          (t.fens.length > 1 ? ' · півхід ' + t.ply : '') + '</i></div>' +
        '<div style="display:flex;gap:4px;align-items:center">' + plyCtl +
        '<select data-mv="' + i + '">' +
          '<option value="auto"' + (t.mover==='auto'?' selected':'') + '>авто</option>' +
          '<option value="w"' + (t.mover==='w'?' selected':'') + '>білі</option>' +
          '<option value="b"' + (t.mover==='b'?' selected':'') + '>чорні</option>' +
          '<option value="hide"' + (t.mover==='hide'?' selected':'') + '>сховати</option>' +
        '</select></div></div>';
    }).join('');
  }
  const named = TASKS.filter(t => t.title).length;
  let line = 'Позицій: <b>' + TASKS.length + '</b> · вибрано <b>' + TASKS.filter(t=>t.on).length + '</b>';
  if(TASKS.length) line += ' · з назвою <b>' + named + '</b>';
  if(TASKS.length && !named) line += '<br><span style="color:#93A2BE">У файлі немає назв — додай тег [Event "…"] до задач.</span>';
  $('#stat').innerHTML = line;
}

/* ─── події ─── */
$('#btnParse').onclick = () => {
  const t = parseInput($('#src').value);
  if(!t.length){ alert('Не знайшов жодної позиції. Потрібен PGN із тегом [FEN "…"] або рядки FEN.'); return; }
  TASKS = t;
  if(TASKS.length > 12) TASKS.forEach((x, i) => x.on = i < 12);
  renderTasks(); render();
};
$('#btnClear').onclick = () => { $('#src').value=''; TASKS=[]; renderTasks(); render(); };
$('#btnFile').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const parts = [];
  for(const f of e.target.files) parts.push(await f.text());
  $('#src').value = parts.join('\n\n');
  $('#btnParse').click();
  e.target.value = '';
};

$('#tasks').addEventListener('change', e => {
  const on = e.target.dataset.on, mv = e.target.dataset.mv;
  if(on !== undefined){ TASKS[+on].on = e.target.checked; }
  if(mv !== undefined){ TASKS[+mv].mover = e.target.value; }
  renderTasks(); render();
});
$('#tasks').addEventListener('click', e => {
  const nm = e.target.closest('.nm');
  if(nm){ openPick(+nm.dataset.i); return; }
  const d = e.target.dataset;
  if(d.ply === undefined) return;
  const t = TASKS[+d.i];
  t.ply = Math.max(0, Math.min(t.fens.length-1, t.ply + (+d.ply)));
  t.fen = t.fens[t.ply];
  renderTasks(); render();
});

/* ─── модалка вибору позиції ─── */
let pickIdx = -1, pickPos = 0;

function openPick(i){
  const t = TASKS[i];
  if(t.fens.length < 2){ alert('У цій позиції немає ходів — нема з чого вибирати.'); return; }
  pickIdx = i; pickPos = t.ply;
  $('#pickTitle').textContent = (i+1) + '. ' + (t.title || 'позиція');
  $('#pickRange').max = t.fens.length - 1;
  $('#pick').classList.add('on');
  drawPick();
}
function closePick(){ $('#pick').classList.remove('on'); pickIdx = -1; }

function drawPick(){
  const t = TASKS[pickIdx];
  pickPos = Math.max(0, Math.min(t.fens.length-1, pickPos));
  $('#pickBoard').innerHTML = boardHTML(t.fens[pickPos], $('#optFlip').checked && t.fens[pickPos].split(' ')[1]==='b', true);
  $('#pickRange').value = pickPos;
  $('#pickPly').textContent = pickPos + ' / ' + (t.fens.length-1);
  let html = '', num = 1;
  const startWhite = (t.base.split(' ')[1] || 'w') === 'w';
  t.sans.forEach((san, k) => {
    const isWhite = startWhite ? k % 2 === 0 : k % 2 === 1;
    if(k === 0 && !isWhite) html += '<i>' + num + '…</i>';
    else if(isWhite) html += '<i>' + num + '.</i>';
    html += '<span data-p="' + (k+1) + '"' + (pickPos === k+1 ? ' class="cur"' : '') + '>' + esc(san) + '</span> ';
    if(!isWhite) num++;
  });
  $('#pickMoves').innerHTML = html || '<span class="stat">ходів немає</span>';
  const cur = $('#pickMoves').querySelector('.cur');
  if(cur) cur.scrollIntoView({block:'nearest'});
}

$('#pickClose').onclick = closePick;
$('#pick').addEventListener('click', e => { if(e.target.id === 'pick') closePick(); });
$('#pickPrev').onclick = () => { pickPos--; drawPick(); };
$('#pickNext').onclick = () => { pickPos++; drawPick(); };
$('#pickStart').onclick = () => { pickPos = 0; drawPick(); };
$('#pickEnd').onclick = () => { pickPos = TASKS[pickIdx].fens.length-1; drawPick(); };
$('#pickRange').addEventListener('input', e => { pickPos = +e.target.value; drawPick(); });
$('#pickMoves').addEventListener('click', e => {
  if(e.target.dataset.p === undefined) return;
  pickPos = +e.target.dataset.p; drawPick();
});
$('#pickTake').onclick = () => {
  const t = TASKS[pickIdx];
  t.ply = pickPos; t.fen = t.fens[pickPos];
  closePick(); renderTasks(); render();
};
document.addEventListener('keydown', e => {
  if(pickIdx < 0) return;
  if(e.key === 'ArrowLeft'){ pickPos--; drawPick(); }
  if(e.key === 'ArrowRight'){ pickPos++; drawPick(); }
  if(e.key === 'Escape') closePick();
  if(e.key === 'Enter') $('#pickTake').click();
});

$('#posMode').addEventListener('change', e => {
  $('#posMove').style.display = e.target.value === 'atmove' ? 'block' : 'none';
});

$('#selAll').onclick = () => { TASKS.forEach(t=>t.on=true); renderTasks(); render(); };
$('#selNone').onclick = () => { TASKS.forEach(t=>t.on=false); renderTasks(); render(); };
$('#selFirst').onclick = () => { TASKS.forEach((t,i)=>t.on = i<12); renderTasks(); render(); };
$('#selRand').onclick = () => {
  const idx = TASKS.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,12);
  TASKS.forEach((t,i)=>t.on = idx.includes(i)); renderTasks(); render();
};
$('#shuffle').onclick = () => { TASKS.sort(()=>Math.random()-.5); renderTasks(); render(); };

['perPage','moverMode','pieceSet','kidsLines','kidsCols','optCoords','optNum','optTitles','optFlip','optAnswers','optFooter']
  .forEach(id => $('#'+id).addEventListener('change', render));
['title','subtitle','taskLabel'].forEach(id => $('#'+id).addEventListener('input', render));

$('#brandMark').style.backgroundImage = 'url(' + LOGO + ')';
$('#optLogo').addEventListener('change', render);

// Режим початківця: показуємо його налаштування і одразу беремо розкладку 2×4
$('#optKids').addEventListener('change', e => {
  $('#kidsBox').style.display = e.target.checked ? 'block' : 'none';
  if(e.target.checked && +$('#perPage').value > 8) $('#perPage').value = '8';
  render();
});

$('#btnPrint').onclick = () => { fitBoards(); window.print(); };
window.addEventListener('beforeprint', fitBoards);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitBoards);
function setZoom(z){
  zoom = Math.max(.4, Math.min(1.4, z));
  $('#sheets').style.transform = 'scale(' + zoom + ')';
  $('#sheets').style.width = (100/zoom) + '%';
  $('#zoomVal').textContent = Math.round(zoom*100) + '%';
}
$('#zoomIn').onclick = () => setZoom(zoom + .1);
$('#zoomOut').onclick = () => setZoom(zoom - .1);

injectPieceCSS();

/* стартовий приклад */
$('#src').value = [
 'r1bqkb1r/pppp1Qpp/2n2n2/4p3/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 0 4',
 '6k1/5ppp/8/8/8/8/5PPP/R5K1 w - - 0 1',
 '8/8/8/8/4k3/8/4P3/4K3 w - - 0 1',
 'r1b1k2r/pppp1ppp/2n5/2b1n3/2B1P1q1/5N2/PPPP1PPP/RNBQ1RK1 w kq - 0 1'
].join('\n');
$('#btnParse').click();
if(window.innerWidth < 1300) setZoom(.6);
</script>
